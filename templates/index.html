<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Predictive Maintenance Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
    <div class="toggle-container" onclick="toggleTheme()">
        <div class="toggle-switch"></div>
        <span id="theme-label">Dark Mode 🌙</span>
    </div>
    <div class="container">
        <div class="dashboard-card">
    <form method="POST" enctype="multipart/form-data" autocomplete="off">
        <h1 class="dashboard-title"><i class="fa-solid fa-wrench"></i> Predictive Maintenance</h1>
        <div class="form-row">
            <label for="model_name"><i class="fa-solid fa-microchip form-icon"></i> Model</label>
            <select name="model_name" id="model_name" class="styled-select" required>
                {% for model in models %}
                <option value="{{ model }}">{{ model }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-row-horizontal">
            <span class="form-label"><i class="fa-solid fa-database form-icon"></i> Input Type</span>
            <div class="toggle-pills">
                <input type="radio" id="dataset" name="input_option" value="dataset" checked>
                <label for="dataset" class="pill pill-anim"><i class="fa-solid fa-table"></i> Dataset</label>
                <input type="radio" id="random" name="input_option" value="random">
                <label for="random" class="pill pill-anim"><i class="fa-solid fa-dice"></i> Random</label>
                <input type="radio" id="csv" name="input_option" value="csv">
                <label for="csv" class="pill pill-anim"><i class="fa-solid fa-file-csv"></i> CSV</label>
                <input type="radio" id="pdf" name="input_option" value="pdf">
                <label for="pdf" class="pill pill-anim"><i class="fa-solid fa-file-pdf"></i> PDF</label>
            </div>
        </div>
        <div id="extraInput" class="hidden-input"></div>
        <button type="submit" class="styled-btn"><i class="fa-solid fa-magnifying-glass"></i> Predict RUL</button>
    </form>
</div>

    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js"></script>
<script>
function toggleTheme() {
    document.body.classList.toggle("light-mode");
    const label = document.getElementById("theme-label");
    label.textContent = document.body.classList.contains("light-mode")
        ? "Light Mode ☀️"
        : "Dark Mode 🌙";
}
function updateInputs() {
    const extra = document.getElementById("extraInput");
    if (document.getElementById("csv").checked) {
        extra.innerHTML =
            `<label for="csv_file"><i class="fa-solid fa-file-csv form-icon"></i> Upload CSV</label>
             <input type="file" name="csv_file" id="csv_file" accept=".csv">`;
        extra.style.display = "block";
    } else if (document.getElementById("pdf").checked) {
        extra.innerHTML =
            `<label for="pdf_file"><i class="fa-solid fa-file-pdf form-icon"></i> Upload PDF</label>
             <input type="file" name="pdf_file" id="pdf_file" accept="application/pdf">`;
        extra.style.display = "block";
    } else {
        extra.innerHTML = "";
        extra.style.display = "none";
    }
}
for(let id of ["dataset","random","csv","pdf"]) {
    document.getElementById(id).addEventListener("change", updateInputs);
}
window.onload = updateInputs;
</script>

</body>
</html>
